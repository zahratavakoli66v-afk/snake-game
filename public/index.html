<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود به تنیس آنلاین</title>
<style>
body{margin:0;background:#0f172a;color:#fff;font-family:Tahoma,Arial;display:flex;justify-content:center;align-items:center;height:100vh}
.card{background:#1e293b;padding:28px;border-radius:18px;width:320px;text-align:center}
input{width:100%;padding:12px;border-radius:10px;border:none;margin:14px 0;box-sizing:border-box}
button{width:100%;padding:12px;border:none;border-radius:10px;background:#22c55e;color:#fff;font-size:18px}
</style>
</head>
<body>
<div class="card">
<h1>🎾 تنیس آنلاین</h1>
<input id="name" placeholder="نام کاربری">
<button onclick="enter()">ورود به بازی</button>
</div>
<script>
function enter(){
 const name=document.getElementById('name').value.trim();
 if(!name){alert('نام کاربری را وارد کنید');return;}
 localStorage.setItem('tennisName',name);
 location.href='game.html';
}
</script>
</body>
</html>
