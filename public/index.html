<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<title>ورود به بازی مار</title>


<style>

body{

    font-family:Arial;

    text-align:center;

    background:#222;

    color:white;

    padding-top:80px;

}


.box{

    background:#333;

    width:300px;

    margin:auto;

    padding:30px;

    border-radius:15px;

}



input{

    width:90%;

    padding:12px;

    font-size:18px;

    border-radius:10px;

    border:none;

}



button{

    margin-top:20px;

    padding:15px 30px;

    font-size:20px;

    border-radius:10px;

    border:none;

    background:#18a558;

    color:white;

    cursor:pointer;

}


</style>


</head>


<body>


<div class="box">


<h1>🐍 بازی مار آنلاین</h1>


<p>
نام خود را وارد کنید
</p>


<input
id="name"
placeholder="نام بازیکن"
>



<br>


<button onclick="enterGame()">

ورود به بازی

</button>


</div>





<script>


function enterGame(){


let name =
document.getElementById("name")
.value
.trim();



if(name===""){


alert(
"لطفاً نام وارد کنید"
);


return;


}




localStorage.setItem(
"playerName",
name
);



location.href=
"/game.html";



}


</script>



</body>

</html>
