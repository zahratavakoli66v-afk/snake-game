<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>بازی مار آنلاین</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      direction: rtl;
      background: #f2f2f2;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #2c3e50;
    }

    input {
      padding: 10px;
      margin: 5px;
      width: 220px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      padding: 10px 20px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #27ae60;
      color: white;
      font-size: 14px;
    }

    button:hover {
      background: #219150;
    }

    #players {
      background: white;
      width: 340px;
      margin: 20px auto;
      padding: 10px;
      border-radius: 10px;
      min-height: 60px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    #messages {
      background: white;
      width: 340px;
      height: 260px;
      overflow-y: auto;
      margin: 20px auto;
      padding: 10px;
      text-align: right;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);

      display: flex;
      flex-direction: column;

      scroll-behavior: smooth;
    }

    #messages p {
      margin: 6px 0;
      padding: 8px;
      background: #f8f8f8;
      border-radius: 6px;
      word-wrap: break-word;
    }

    #messages b {
      color: #2980b9;
    }

    .chat-box {
      width: 340px;
      margin: 0 auto;
    }

    .chat-box input {
      width: 240px;
    }
  </style>
</head>

<body>

<h1>🐍 بازی مار آنلاین</h1>

<p>نام خود را وارد کنید</p>

<input id="name" placeholder="نام بازیکن">

<br>

<button onclick="joinGame()">ورود به بازی</button>


<h2>👥 بازیکنان آنلاین</h2>

<div id="players">
  هنوز کسی وارد نشده
</div>


<h2>💬 چت آنلاین</h2>

<div id="messages"></div>

<div class="chat-box">
  <input id="message" placeholder="پیام خود را بنویس">
  <button onclick="sendMessage()">ارسال</button>
</div>


<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();


// ورود به بازی

function joinGame(){

  const name =
  document.getElementById("name").value.trim();


  if(name === ''){

    alert('لطفاً نام خود را وارد کنید');

    return;

  }


  socket.emit('joinGame',{

    name:name

  });


  alert('وارد بازی شدی: ' + name);

}



// دریافت لیست بازیکنان

socket.on('playersList',(players)=>{


  const box =
  document.getElementById('players');


  box.innerHTML='';


  if(players.length === 0){

    box.innerHTML =
    '<p>هنوز کسی وارد نشده</p>';

    return;

  }



  players.forEach(player=>{


    const item =
    document.createElement('p');


    item.innerHTML =
    '🐍 ' + player;


    box.appendChild(item);


  });



});




// ارسال پیام

function sendMessage(){


  const input =
  document.getElementById('message');


  const msg =
  input.value.trim();



  if(msg === '') return;



  socket.emit(
    'chatMessage',
    msg
  );



  input.value='';


}





// دریافت پیام

socket.on('chatMessage',(data)=>{


  const box =
  document.getElementById('messages');



  const message =
  document.createElement('p');



  message.innerHTML =

  '<b>'
  + data.name
  + ':</b> '
  + data.message;



  box.appendChild(message);



  // همیشه آخرین پیام دیده شود

  box.scrollTop =
  box.scrollHeight;



});



</script>

</body>
</html>
