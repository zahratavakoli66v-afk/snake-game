
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>بازی مار آنلاین</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#1e1e1e;
    color:white;
    text-align:center;
}

.header{
    background:#2c3e50;
    padding:15px;
    font-size:24px;
    font-weight:bold;
}

.topbar{
    display:flex;
    justify-content:center;
    gap:30px;
    padding:10px;
    font-size:20px;
}

.container{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    padding:20px;
}

canvas{
    background:#111;
    border:3px solid #27ae60;
    border-radius:12px;
}

.sidebar{
    width:300px;
    background:#2d2d2d;
    border-radius:12px;
    padding:15px;
}

.sidebar h3{
    color:#27ae60;
    margin-top:0;
}

#players{
    text-align:right;
    min-height:120px;
}

#messages{
    background:#1a1a1a;
    height:180px;
    overflow-y:auto;
    border-radius:8px;
    padding:10px;
    text-align:right;
    margin-bottom:10px;
}

#messages p{
    margin:5px 0;
    padding:6px;
    background:#333;
    border-radius:6px;
}

input{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    margin-bottom:10px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    margin-bottom:10px;
}

#startBtn{
    background:#f39c12;
    color:white;
}

#exitBtn{
    background:#d9534f;
    color:white;
}

.controls{
    width:330px;
    margin:20px auto;
}

.controls .row{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-bottom:15px;
}

.dir{
    width:100px;
    height:100px;
    font-size:42px;
    border-radius:18px;
    background:#34495e;
    color:white;
}

.dir:active{
    background:#27ae60;
}

.status{
    margin:10px 0;
    color:#f1c40f;
    font-size:18px;
}
</style>
</head>

<body>

<div class="header">🐍 بازی مار آنلاین</div>

<div class="topbar">
  <div>⏱ زمان: <span id="timer">180</span></div>
  <div>🏆 امتیاز: <span id="score">0</span></div>
</div>

<div class="container">

  <canvas id="game" width="400" height="400"></canvas>

  <div class="sidebar">

    <h3>👤 بازیکن</h3>
    <div id="playerName"></div>

    <div class="status" id="status">در انتظار شروع بازی</div>

    <button id="startBtn" style="display:none">🎮 شروع بازی</button>

    <button id="exitBtn">🚪 خروج از بازی</button>

    <h3>👥 بازیکنان</h3>
    <div id="players"></div>

    <h3>💬 چت</h3>
    <div id="messages"></div>

    <input id="message" placeholder="پیام خود را بنویس">
    <button id="sendBtn">ارسال</button>

  </div>

</div>

<div class="controls">

  <div class="row">
    <button class="dir" onclick="changeDir('up')">⬆️</button>
  </div>

  <div class="row">
    <button class="dir" onclick="changeDir('left')">⬅️</button>
    <button class="dir" onclick="changeDir('down')">⬇️</button>
    <button class="dir" onclick="changeDir('right')">➡️</button>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const name = localStorage.getItem('playerName') || 'بازیکن';

document.getElementById('playerName').innerText = name;

let isHost = false;
let gameStarted = false;
let players = [];
let food = {x:0,y:0};

socket.emit('joinGame',{name:name});

socket.on('host',(status)=>{
  isHost = status;
  document.getElementById('startBtn').style.display =
    status ? 'block' : 'none';
});

socket.on('players',(list)=>{
  players = list;

  const box = document.getElementById('players');
  box.innerHTML = '';

  list.forEach(p=>{
    const div = document.createElement('div');
    div.innerHTML =
      (p.alive ? '🟢 ' : '👀 ') +
      p.name +
      ' (' + p.score + ')';
    box.appendChild(div);
  });
});

document.getElementById('startBtn').onclick = ()=>{
  socket.emit('startGame');
};

socket.on('started',(data)=>{
  gameStarted = true;
  document.getElementById('status').innerText = 'بازی شروع شد';
  document.getElementById('timer').innerText = data.time;
});

socket.on('time',(t)=>{
  document.getElementById('timer').innerText = t;
});

socket.on('state',(state)=>{
  players = state.players;
  food = state.food;
  draw();

  const me = players.find(p=>p.id===socket.id);
  if(me){
    document.getElementById('score').innerText = me.score;
    if(!me.alive){
      document.getElementById('status').innerText =
        'شما سوختید و اکنون تماشاگر هستید';
    }
  }
});

socket.on('dead',(data)=>{
  addMessage('🔥 ' + data.name + ' سوخت');
});

socket.on('finished',(data)=>{
  gameStarted = false;
  document.getElementById('status').innerText = 'بازی تمام شد';
  alert(
    'بازی تمام شد\\n\\nبرنده: ' +
    data.winner +
    '\\nامتیاز: ' +
    data.score
  );
});

function draw(){
  ctx.clearRect(0,0,400,400);

  ctx.fillStyle = 'red';
  ctx.fillRect(food.x, food.y, 10, 10);

  players.forEach(p=>{
    if(!p.snake) return;

    ctx.fillStyle = p.alive ? '#27ae60' : '#888';

    p.snake.forEach(part=>{
      ctx.fillRect(part.x, part.y, 10, 10);
    });
  });
}

function changeDir(dir){
  if(!gameStarted) return;
  socket.emit('direction', dir);
}

document.addEventListener('keydown',(e)=>{
  if(e.key==='ArrowUp') changeDir('up');
  if(e.key==='ArrowDown') changeDir('down');
  if(e.key==='ArrowLeft') changeDir('left');
  if(e.key==='ArrowRight') changeDir('right');
});

document.getElementById('sendBtn').onclick = ()=>{
  const input = document.getElementById('message');
  const msg = input.value.trim();
  if(!msg) return;
  socket.emit('chatMessage', msg);
  input.value = '';
};

socket.on('chatMessage',(data)=>{
  addMessage('💬 ' + data.name + ': ' + data.message);
});

function addMessage(text){
  const box = document.getElementById('messages');
  const p = document.createElement('p');
  p.innerText = text;
  box.appendChild(p);
  box.scrollTop = box.scrollHeight;
}

document.getElementById('exitBtn').onclick = ()=>{
  socket.emit('leave');
  localStorage.removeItem('playerName');
  window.location.href = '/';
};

window.addEventListener('beforeunload',()=>{
  socket.emit('leave');
});

</script>

</body>
</html>
