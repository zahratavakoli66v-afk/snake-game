
<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>بازی مار آنلاین</title>
<style>
body{
  margin:0;
  background:#1e1e1e;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

.header{
  background:#2c3e50;
  padding:15px;
  font-size:22px;
}

.container{
  display:flex;
  justify-content:center;
  gap:20px;
  flex-wrap:wrap;
  padding:20px;
}

canvas{
  background:#111;
  border:3px solid #27ae60;
  border-radius:10px;
}

.sidebar{
  width:300px;
  background:#2d2d2d;
  border-radius:10px;
  padding:15px;
}

#messages{
  height:220px;
  overflow-y:auto;
  background:#1a1a1a;
  border-radius:8px;
  padding:10px;
  text-align:right;
}

#messages p{
  background:#333;
  padding:6px;
  border-radius:6px;
}

input{
  width:100%;
  padding:10px;
  border:none;
  border-radius:6px;
  margin:10px 0;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#27ae60;
  color:white;
  cursor:pointer;
  font-size:18px;
}

#startBtn{
  background:#f39c12;
}

#status{
  margin:10px 0;
  color:#f1c40f;
}

.controls{
  margin:25px auto;
  width:320px;
  display:grid;
  grid-template-columns:100px 100px 100px;
  grid-template-rows:100px 100px;
  gap:10px;
  justify-content:center;
}

.control-btn{
  width:100px;
  height:100px;
  font-size:40px;
  background:#34495e;
  border-radius:16px;
}

.control-btn:active{
  background:#27ae60;
}

.empty{
  visibility:hidden;
}
</style>
</head>
<body>

<div class="header">🐍 بازی مار آنلاین</div>

<div class="container">

<canvas id="gameCanvas" width="500" height="500"></canvas>

<div class="sidebar">

<h3>👤 بازیکن</h3>
<p id="playerName"></p>

<div id="status">در انتظار تعیین میزبان...</div>

<button id="startBtn" disabled>🎮 شروع بازی</button>

<h3>👥 بازیکنان آنلاین</h3>
<div id="players"></div>

<h3>💬 چت</h3>
<div id="messages"></div>

<input id="message" placeholder="پیام خود را بنویس">

<button onclick="sendMessage()">ارسال</button>

</div>

</div>

<div class="controls">
<div class="empty"></div>
<button class="control-btn" onclick="setDirection('UP')">⬆️</button>
<div class="empty"></div>

<button class="control-btn" onclick="setDirection('RIGHT')">➡️</button>
<button class="control-btn" onclick="setDirection('DOWN')">⬇️</button>
<button class="control-btn" onclick="setDirection('LEFT')">⬅️</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

const name = localStorage.getItem('playerName') || 'بازیکن';
document.getElementById('playerName').innerText = name;

socket.emit('joinGame',{name});

let gameRunning = false;
let isHost = false;

socket.on('playersList', players => {
  const box = document.getElementById('players');
  box.innerHTML = '';
  players.forEach(p => {
    box.innerHTML += '<p>🐍 '+p+'</p>';
  });
});

socket.on('hostInfo', data => {
  isHost = socket.id === data.hostId;

  const status = document.getElementById('status');
  const btn = document.getElementById('startBtn');

  if(isHost){
    status.innerText = data.gameStarted ? 'بازی در حال اجراست' : 'شما میزبان هستید';
    btn.disabled = data.gameStarted;
  }else{
    status.innerText = data.gameStarted ? 'بازی در حال اجراست' : 'در انتظار شروع بازی توسط میزبان';
    btn.disabled = true;
  }
});

document.getElementById('startBtn').onclick = () => {
  socket.emit('startGame');
};

socket.on('gameStarted', () => {
  gameRunning = true;
  document.getElementById('status').innerText = 'بازی شروع شد';
});

function sendMessage(){
  const input = document.getElementById('message');
  const msg = input.value.trim();
  if(!msg) return;
  socket.emit('chatMessage', msg);
  input.value = '';
}

socket.on('chatMessage', data => {
  const box = document.getElementById('messages');
  box.innerHTML += '<p><b>'+data.name+':</b> '+data.message+'</p>';
  box.scrollTop = box.scrollHeight;
});

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const grid = 20;

let snake = [
  {x:10,y:10},
  {x:9,y:10},
  {x:8,y:10}
];

let direction = 'RIGHT';
let food = {x:15,y:12};
let score = 0;

function setDirection(dir){
  if(dir==='UP' && direction!=='DOWN') direction='UP';
  if(dir==='DOWN' && direction!=='UP') direction='DOWN';
  if(dir==='LEFT' && direction!=='RIGHT') direction='LEFT';
  if(dir==='RIGHT' && direction!=='LEFT') direction='RIGHT';
}

document.addEventListener('keydown', e => {
  if(e.key==='ArrowUp') setDirection('UP');
  if(e.key==='ArrowDown') setDirection('DOWN');
  if(e.key==='ArrowLeft') setDirection('LEFT');
  if(e.key==='ArrowRight') setDirection('RIGHT');
});

function draw(){
  ctx.fillStyle='#111';
  ctx.fillRect(0,0,500,500);

  ctx.fillStyle='red';
  ctx.fillRect(food.x*grid, food.y*grid, grid, grid);

  ctx.fillStyle='#27ae60';
  snake.forEach(p => {
    ctx.fillRect(p.x*grid, p.y*grid, grid, grid);
  });

  ctx.fillStyle='white';
  ctx.font='18px Arial';
  ctx.fillText('امتیاز: '+score,10,25);

  if(!gameRunning){
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.fillRect(0,0,500,500);
    ctx.fillStyle='white';
    ctx.font='28px Arial';
    ctx.fillText('در انتظار شروع بازی',120,250);
  }
}

function update(){
  if(!gameRunning) return;

  const head={...snake[0]};

  if(direction==='UP') head.y--;
  if(direction==='DOWN') head.y++;
  if(direction==='LEFT') head.x--;
  if(direction==='RIGHT') head.x++;

  if(head.x<0 || head.y<0 || head.x>=25 || head.y>=25){
    gameRunning=false;
    alert('بازی تمام شد');
    return;
  }

  snake.unshift(head);

  if(head.x===food.x && head.y===food.y){
    score++;
    food={
      x:Math.floor(Math.random()*25),
      y:Math.floor(Math.random()*25)
    };
  }else{
    snake.pop();
  }
}

function loop(){
  update();
  draw();
}

draw();

// سرعت کمتر (250 میلی‌ثانیه)
setInterval(loop,250);
</script>

</body>
</html>
```
