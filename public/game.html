<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تنیس آنلاین</title>
<style>
body{margin:0;background:#0f172a;color:#fff;font-family:Tahoma,Arial;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden}
canvas{background:#111827;border:3px solid #22c55e;border-radius:16px;touch-action:none}
</style>
</head>
<body>
<canvas id="game" width="400" height="600"></canvas>
<script>
const c=document.getElementById('game');
const ctx=c.getContext('2d');
let paddle={x:150,w:100,h:10};
let ball={x:200,y:300,vx:3,vy:4,r:8};

function draw(){
 ctx.clearRect(0,0,400,600);
 ctx.fillStyle='#22c55e';
 ctx.fillRect(paddle.x,580,paddle.w,paddle.h);
 ctx.fillStyle='#ef4444';
 ctx.fillRect(paddle.x,10,paddle.w,paddle.h);
 ctx.fillStyle='#facc15';
 ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
}

function update(){
 ball.x+=ball.vx;
 ball.y+=ball.vy;
 if(ball.x<ball.r||ball.x>400-ball.r) ball.vx*=-1;
 if(ball.y>572&&ball.x>paddle.x&&ball.x<paddle.x+paddle.w) ball.vy=-Math.abs(ball.vy);
 if(ball.y<28&&ball.x>paddle.x&&ball.x<paddle.x+paddle.w) ball.vy=Math.abs(ball.vy);
 if(ball.y<0||ball.y>600){ball.x=200;ball.y=300;ball.vx=3*(Math.random()>0.5?1:-1);ball.vy=4*(ball.y<0?1:-1);}
 draw();
 requestAnimationFrame(update);
}

function move(clientX){
 const r=c.getBoundingClientRect();
 paddle.x=Math.max(0,Math.min(300,clientX-r.left-50));
}
c.addEventListener('touchmove',e=>{e.preventDefault();move(e.touches[0].clientX);},{passive:false});
c.addEventListener('mousemove',e=>move(e.clientX));
update();
</script>
</body>
</html>
